services:

  food-forum-db:
    image: postgres:17
    container_name: food-forum-db
    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - food_forum_db_data:/var/lib/postgresql/data

    networks:
      - food-forum-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: food-forum-pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "8080:80"

    depends_on:
      - food-forum-db

    networks:
      - food-forum-network

volumes:
  food_forum_db_data:

networks:
  food-forum-network:
    driver: bridge
